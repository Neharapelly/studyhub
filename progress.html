<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyHub - Progress</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="progress-page">

        <div class="success-icon">
            🎉
        </div>

        <h1>Great Job!</h1>

        <p class="success-text">
            You completed the lesson and quiz.
        </p>


        <!-- Overall Progress -->

        <section class="progress-card">

            <h2>Your Progress</h2>

            <div class="big-progress">

                <div class="big-progress-fill">
                </div>

            </div>

            <h3>80% Complete</h3>

            <p>
                Keep learning and reach your goal!
            </p>

        </section>


        <!-- Quiz Result -->

        <section class="result-card">

            <h2>Quiz Result</h2>

            <div class="score">
                4 / 5
            </div>

            <p>Correct Answers</p>

        </section>


        <!-- Course Status -->

        <section class="completed-card">

            <div class="check-icon">
                ✓
            </div>

            <div>

                <h3>HTML & CSS</h3>

                <p>
                    Course in progress
                </p>

            </div>

        </section>


        <!-- Buttons -->

        <a href="dashboard.html"
           class="start-button progress-button">

            Back to Dashboard

        </a>

        <a href="course.html"
           class="secondary-button">

            Continue Learning

        </a>

    </main>

</body>

</html>
