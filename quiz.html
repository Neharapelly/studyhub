<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub - Quiz Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">

    <div class="logo">STUDYHUB</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="lesson.html">Lesson</a>
        <a href="progress.html">Progress</a>
    </nav>

</header>

<main>

    <section class="quiz-container">

        <div class="quiz-header">

            <div>
                <p>UI/UX Design Fundamentals</p>
                <h1>Lesson 01 Quiz</h1>
            </div>

            <div class="quiz-progress">
                Question 1 of 5
            </div>

        </div>


        <div class="question-card">

            <h2>
                What does UX stand for?
            </h2>

            <label class="answer-option">
                <input type="radio" name="answer">
                <span>A. User Experience</span>
            </label>

            <label class="answer-option">
                <input type="radio" name="answer">
                <span>B. User Example</span>
            </label>

            <label class="answer-option">
                <input type="radio" name="answer">
                <span>C. User Extension</span>
            </label>

            <label class="answer-option">
                <input type="radio" name="answer">
                <span>D. User Experiment</span>
            </label>

        </div>


        <div class="quiz-actions">

            <a href="lesson.html" class="outline-button">
                Previous
            </a>

            <a href="progress.html" class="button">
                Submit Quiz
            </a>

        </div>

    </section>

</main>

<footer>
    <p>StudyHub Quiz Wireframe</p>
</footer>

</body>
</html>
